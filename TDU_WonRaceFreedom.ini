; TDU_WonRaceFreedom - settings (1 = on, 0 = off)
[Settings]
Enabled=1

; What counts as "already won":
;   1 = only a 1st place / gold result
;   0 = any podium / medal result (gold, silver or bronze)
RequireGold=1

; Lift the vehicle restriction (car type, brand, model, class) on won challenges
UnlockVehicle=1

; Replace the AI opponents of won challenges with random vehicles of YOUR class
; (cars vs cars, bikes vs bikes). Events without opponents are left alone.
RandomizeOpponents=1

; Write TDU_WonRaceFreedom.log next to this file (useful if something misbehaves)
Log=1
